<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>あっち向いてホイ・ゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3ede2; --paper:#fffaf2; --ink:#2a2420; --ink-2:#6a6058; --ink-3:#a39788; --line:#e2d8c8;
  --accent:#e2583e; --accent-2:#f6c64b; --win:#2f9e6a; --lose:#c4473a;
  --font:'M PLUS Rounded 1c',system-ui,-apple-system,'Hiragino Maru Gothic ProN',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font)}
body{min-height:100dvh;display:flex;justify-content:center;
  background-image:radial-gradient(circle at 20% 10%,#fbf3e4 0,transparent 40%),radial-gradient(circle at 90% 90%,#efe2cc 0,transparent 45%)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.wrap{width:100%;max-width:560px;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;min-height:100dvh}
.screen{display:none;flex-direction:column;flex:1;gap:14px}
.screen.on{display:flex}

h1{font-size:clamp(24px,6vw,32px);font-weight:800;margin:8px 0 0;letter-spacing:.02em;line-height:1.25}
h1 small{display:block;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.2em;margin-bottom:4px}
p{line-height:1.8;margin:0}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:18px;padding:18px;box-shadow:4px 4px 0 var(--ink)}
.muted{color:var(--ink-2);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:14px;
  background:var(--paper);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-weight:800;font-size:17px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.full{width:100%}
input[type=text],textarea{width:100%;font:inherit;font-size:20px;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink)}
textarea{font-size:16px;min-height:140px;resize:vertical;line-height:1.6}
input:focus,textarea:focus{outline:3px solid var(--accent-2);outline-offset:1px}
label{font-weight:700;font-size:15px;display:block;margin-bottom:8px}
.err{color:var(--lose);font-size:14px;min-height:20px;margin-top:6px}
.spacer{flex:1}

/* ---------- キャラクタ ---------- */
.char{display:block;width:100%;height:100%;overflow:visible}
.char .head,.char .face{transform-box:view-box;transition:transform .28s cubic-bezier(.3,1.6,.5,1)}
.char .head{transform-origin:150px 214px}
.char.look-L .head{transform:translateX(-10px) rotate(-6deg)}
.char.look-L .face{transform:translateX(-18px)}
.char.look-R .head{transform:translateX(10px) rotate(6deg)}
.char.look-R .face{transform:translateX(18px)}
.char .body{transform-box:view-box;transform-origin:150px 320px;animation:breathe 3.2s ease-in-out infinite}
.char .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.char .antenna,.char .led{animation:pulse 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.char .body,.char .eyes,.char .antenna,.char .led{animation:none}}

/* ---------- 導入画面 ---------- */
.intro-stage{width:min(62vw,240px);aspect-ratio:300/330;margin:0 auto}
.rules{display:flex;flex-direction:column;gap:10px}
.rule{display:flex;gap:10px;align-items:flex-start;line-height:1.7}
.rule b.ic{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:14px;background:var(--accent-2)}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;border:2px solid var(--ink);font-weight:800;font-size:14px;background:#fff}

/* ---------- ゲーム画面 ---------- */
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.score{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:6px 12px;text-align:center;box-shadow:3px 3px 0 var(--ink)}
.score .who{font-size:12px;font-weight:700;color:var(--ink-2)}
.score .pt{font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.score .pt small{font-size:13px;font-weight:700;margin-left:2px}
.score.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.12)}}
.round{text-align:center;font-weight:800;font-size:14px;color:var(--ink-2);line-height:1.2}
.round b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.progress{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);width:0;transition:width .3s}

.stage{position:relative;flex:1;min-height:260px;background:var(--paper);border:2px solid var(--ink);border-radius:22px;box-shadow:4px 4px 0 var(--ink);overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.stage::before{content:"";position:absolute;left:50%;top:0;width:90%;height:100%;transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 30%,rgba(246,198,75,.28) 0,transparent 62%);pointer-events:none}
.stage .opp-name{position:absolute;top:12px;left:14px;z-index:2}
.char-box{position:relative;width:min(70%,300px);max-height:100%;aspect-ratio:300/330;margin-bottom:-4px}
.call{position:absolute;top:44px;left:0;right:0;text-align:center;font-weight:800;font-size:clamp(22px,6vw,30px);z-index:2;min-height:1.3em;letter-spacing:.04em}
.call.hoi{color:var(--accent);animation:pop .3s}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.pointer{position:absolute;top:48%;width:64px;height:64px;z-index:3;opacity:0;transition:opacity .15s}
.pointer.on{opacity:1}
.pointer.L{left:max(8px,calc(50% - 160px));transform:scaleX(-1)}
.pointer.R{right:max(8px,calc(50% - 160px))}
.result{position:absolute;bottom:14px;left:0;right:0;margin:0 auto;width:fit-content;max-width:calc(100% - 16px);padding:6px 16px;border-radius:999px;border:2px solid var(--ink);
  font-weight:800;font-size:18px;background:#fff;white-space:nowrap;z-index:3;opacity:0}
.result.on{opacity:1;animation:pop .3s}
.result.win{background:var(--win);color:#fff}
.result.lose{background:#fff;color:var(--lose)}
.hist{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;min-height:0}
.hist span{width:22px;height:22px;border-radius:6px;border:2px solid var(--ink);font-size:11px;font-weight:800;display:grid;place-items:center;background:#fff}

.prompt{text-align:center;font-weight:700;color:var(--ink-2);font-size:15px;min-height:22px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{min-height:84px;border-radius:18px;background:#fff;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;gap:10px;font-size:24px;font-weight:800;transition:transform .08s,box-shadow .08s,background .15s}
.choice svg{width:40px;height:40px}
.choice.L svg{transform:scaleX(-1)}
.choice:active:not(:disabled){transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.choice:disabled{cursor:default}
.choice.picked{background:var(--accent-2)}
.choices.locked .choice:not(.picked){opacity:.4}
.keyhint{text-align:center;font-size:12px;color:var(--ink-3)}
@media (hover:none){.keyhint{display:none}}

/* ---------- 送信 ---------- */
.big-score{text-align:center;font-size:20px;font-weight:800}
.big-score b{font-size:36px}
.status{font-weight:700;text-align:center;padding:12px;border-radius:12px;border:2px dashed var(--ink-3)}
.status.ok{border-style:solid;border-color:var(--win);color:var(--win);background:#eaf7f0}
.status.ng{border-style:solid;border-color:var(--lose);color:var(--lose);background:#fbecea}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

@media (min-height:760px){.choice{min-height:96px}}
@media (max-height:640px){.stage{min-height:200px}.call{top:36px}.choice{min-height:68px}}
</style>
</head>
<body>
<div class="wrap">

  <!-- 1. 学籍番号 -->
  <section class="screen on" id="s-id">
    <h1><small>コンピュータインタラクション 実習</small>あっち向いて<br>ホイ・ゲーム</h1>
    <div class="card">
      <label for="sid">学籍番号</label>
      <input type="text" id="sid" autocomplete="off" autocapitalize="characters" inputmode="text" placeholder="例：2501234">
      <div class="err" id="sid-err"></div>
      <p class="muted">学籍番号は出席確認と、ゲームの記録の整理に使います。</p>
    </div>
    <div class="muted" id="pending-note"></div>
    <div class="spacer"></div>
    <button class="btn primary full" id="btn-id">はじめる</button>
  </section>

  <!-- 2. 相手の紹介とルール -->
  <section class="screen" id="s-intro">
    <div class="intro-stage" id="intro-char"></div>
    <div class="card rules">
      <p style="font-weight:800;font-size:17px" id="intro-line"></p>
      <div class="rule"><b class="ic">1</b><span>あなたは、<b>左</b>か<b>右</b>を指さします。<br>あいても同時に、<b>左</b>か<b>右</b>に顔を向けます。</span></div>
      <div class="rule"><b class="ic">2</b><span>あいてが、あなたの<b>指さした方を向いたら、あなたに1点</b>。<br>ちがう方を向いたら、<b>あいてに1点</b>。</span></div>
      <div class="rule"><b class="ic">3</b><span>全部で <b id="intro-n">40</b> 回。できるだけたくさん点を取ってください。</span></div>
      <p class="muted">※ 左右は、画面で見たときの左右です。</p>
    </div>
    <div class="spacer"></div>
    <button class="btn primary full" id="btn-start">ゲーム開始</button>
  </section>

  <!-- 3. ゲーム -->
  <section class="screen" id="s-game">
    <div class="hud">
      <div class="score" id="sc-me"><div class="who">あなた</div><div class="pt"><span id="pt-me">0</span><small>点</small></div></div>
      <div class="round"><b id="rd">1</b>回め / <span id="rd-n">40</span></div>
      <div class="score" id="sc-op"><div class="who">あいて</div><div class="pt"><span id="pt-op">0</span><small>点</small></div></div>
    </div>
    <div class="progress"><i id="prog"></i></div>
    <div class="stage">
      <span class="tag opp-name" id="opp-name">あいて</span>
      <div class="call" id="call"></div>
      <svg class="pointer" id="pointer" viewBox="0 0 64 64" aria-hidden="true"><use href="#hand"/></svg>
      <div class="char-box" id="game-char"></div>
      <div class="result" id="result"></div>
    </div>
    <div class="hist" id="hist"></div>
    <div class="prompt" id="prompt">どっちを指さす？</div>
    <div class="choices" id="choices">
      <button class="choice L" data-c="L" aria-label="左を指さす"><svg viewBox="0 0 64 64"><use href="#hand"/></svg>左</button>
      <button class="choice R" data-c="R" aria-label="右を指さす">右<svg viewBox="0 0 64 64"><use href="#hand"/></svg></button>
    </div>
    <div class="keyhint">キーボードの ← → でも選べます</div>
  </section>

  <!-- 4. 事後質問 -->
  <section class="screen" id="s-post">
    <h1>おつかれさまでした</h1>
    <div class="big-score" id="post-score"></div>
    <div class="card">
      <label for="rule-text">あいての出し方（顔の向け方）に、何か規則はありましたか？<br>気づいたことを自由に書いてください。</label>
      <textarea id="rule-text" placeholder="特になければ「なし」と書いてください"></textarea>
      <div class="err" id="rule-err"></div>
    </div>
    <div class="spacer"></div>
    <button class="btn primary full" id="btn-post">送信する</button>
  </section>

  <!-- 5. 完了 -->
  <section class="screen" id="s-done">
    <h1>記録を送信しています</h1>
    <div class="status" id="send-status">送信中…</div>
    <div class="row" id="send-actions" style="display:none">
      <button class="btn" id="btn-retry">もう一度送信する</button>
      <button class="btn" id="btn-dl">記録をファイルで保存</button>
    </div>
    <p class="muted" id="done-note" style="text-align:center"></p>
  </section>
</div>

<!-- 指さしの手（共通シンボル） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="hand" viewBox="0 0 64 64">
    <path d="M6 30 C6 24 10 22 16 22 L44 22 C48 22 50 24 50 27 C50 30 48 32 44 32 L34 32 L34 34 C38 34 40 36 40 39 C40 42 38 43 35 43 C38 43 39 45 39 47 C39 50 37 51 34 51 C36 51 37 53 37 55 C37 58 35 59 32 59 L18 59 C10 59 6 54 6 46 Z"
      fill="#f6cfad" stroke="#2a2420" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M44 22 L58 22 C61 22 62 24 62 27 C62 30 61 32 58 32 L44 32" fill="#f6cfad" stroke="#2a2420" stroke-width="3.5" stroke-linejoin="round"/>
  </symbol>
</svg>

<script src="config.js"></script>
<script src="js/characters.js"></script>
<script src="js/game.js"></script>
</body>
</html>
